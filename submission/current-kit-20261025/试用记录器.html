<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自在弈境 · 真实试用记录器</title><style>body{font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif;background:#eef2f5;color:#15283b;margin:0}main{max-width:900px;margin:auto;padding:30px 20px}h1{font-size:30px}section{background:white;border:1px solid #bccbd7;border-radius:12px;padding:20px;margin:18px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #7b8b9b;border-radius:6px;box-sizing:border-box}input:not([type=checkbox]),select,textarea{width:100%}textarea{min-height:80px}button{cursor:pointer;background:#163c53;color:white;margin:5px 8px 5px 0}button:disabled{opacity:.5;cursor:default}small{color:#40556b}.notice{border-left:4px solid #997125;padding:12px;background:#fff6df}a{color:#185b85}fieldset{border:0;padding:0;margin:0}*:focus-visible{outline:3px solid #986300;outline-offset:3px}@media print{button,.notice{display:none}}</style></head><body><main><h1>真实玩家试用记录器</h1><p class="notice">当前没有预填真实用户结果。这是本地记录工具，填写内容保存在当前浏览器，未上传服务器。请用匿名代号，不填姓名、电话、游戏密码。导出后由参与者自行决定是否交给项目作者。</p><section><label><input id="consent" type="checkbox"> 我自愿参加并同意将导出的匿名记录交给项目作者分析；可以随时停止。</label><label>试用代号（例如T01）<input id="tester" maxlength="24" placeholder="不要填写真名"></label><label>网络类型<select id="network"><option value="">请选择</option><option>校园网</option><option>移动数据</option><option>家庭网络</option><option>其他</option></select></label><label>网站入口能否打开<select id="access"><option value="">待检查</option><option>可以打开</option><option>打不开</option></select></label><label>使用的网址<input id="url" type="url" placeholder="填写实际打开的网址"></label><label>入口问题或设备说明<textarea id="entry" maxlength="1200"></textarea></label></section><div id="tasks"></div><section><h2>最后三个问题</h2><label>你认为推荐依据是什么？<textarea id="basis" maxlength="1200"></textarea></label><label>哪一步最困惑？<textarea id="confusion" maxlength="1200"></textarea></label><label>下次是否愿意使用？为什么？<textarea id="reuse" maxlength="1200"></textarea></label><label><input id="quote" type="checkbox"> 同意匿名引用我填写的原话（可不选）</label><button id="export">导出匿名记录JSON</button><button id="reset">清空当前记录</button><p id="status" role="status"></p></section><p><small>计时只表示记录器中的计时；请同步操作网站。失败、需要帮助、未尝试分别记录，不用空白冒充成功。若浏览器禁止保存，及时导出。</small></p></main><script>
const tasks=[['T1','找到赵怀真的梯度、胜率，说明日期与来源'],['T2','登记一位真实常用英雄，刷新后找回'],['T3','逐手BP完成四步，撤回一步后继续'],['T4','为已选摇摆英雄调整分路'],['T5','用1—3位实际成员查看体系与缺口'],['T6','下载个人备份，找到恢复入口（不覆盖）']];
const key='zizai-research-trial-v1';let data={schemaVersion:1,kind:'real-participant-pending',tasks:tasks.map(([id])=>({id,outcome:'未尝试',seconds:null,note:''}))};const status=document.getElementById('status');
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.schemaVersion===1&&Array.isArray(saved.tasks)&&saved.tasks.length===6&&saved.tasks.every((t,i)=>t.id===tasks[i][0]))data=saved;}catch{}
const starts=new Map();
for(const [id,title] of tasks){const section=document.createElement('section');section.innerHTML='<h2></h2><button type="button" class="start">开始计时</button><button type="button" class="stop" disabled>停止计时</button><p class="timer" aria-live="polite"></p><label>任务结果<select class="outcome"><option>未尝试</option><option>独立成功</option><option>帮助后成功</option><option>失败</option></select></label><label>实际秒数（可以校正，未知留空）<input type="number" min="0" max="86400" step="0.1" class="seconds"></label><label>观察、提示次数、失败原因<textarea class="note" maxlength="1200"></textarea></label>';section.querySelector('h2').textContent=id+' · '+title;section.dataset.id=id;const row=data.tasks.find(t=>t.id===id);section.querySelector('.outcome').value=row.outcome;section.querySelector('.seconds').value=row.seconds??'';section.querySelector('.note').value=row.note??'';
section.querySelector('.start').onclick=()=>{starts.set(id,performance.now());section.querySelector('.start').disabled=true;section.querySelector('.stop').disabled=false;section.querySelector('.timer').textContent='正在计时，请在网站完成任务后停止。';};section.querySelector('.stop').onclick=()=>{section.querySelector('.seconds').value=((performance.now()-starts.get(id))/1000).toFixed(1);starts.delete(id);section.querySelector('.start').disabled=false;section.querySelector('.stop').disabled=true;section.querySelector('.timer').textContent='计时停止，请如实选择结果。';save();};document.getElementById('tasks').append(section);}
const fields=['tester','network','access','url','entry','basis','confusion','reuse'];for(const id of fields)document.getElementById(id).value=data[id]??'';for(const id of ['consent','quote'])document.getElementById(id).checked=data[id]===true;
function collect(){for(const id of fields)data[id]=document.getElementById(id).value.trim();for(const id of ['consent','quote'])data[id]=document.getElementById(id).checked;data.tasks=[...document.querySelectorAll('[data-id]')].map(e=>({id:e.dataset.id,outcome:e.querySelector('.outcome').value,seconds:e.querySelector('.seconds').value===''?null:Number(e.querySelector('.seconds').value),note:e.querySelector('.note').value.trim()}));data.updatedAt=new Date().toISOString();return data;}
function save(){collect();try{localStorage.setItem(key,JSON.stringify(data));status.textContent='已保存到此浏览器。尚未上传。';}catch{status.textContent='浏览器未允许本地保存，请及时导出。';}}
document.addEventListener('input',save);document.addEventListener('change',save);
document.getElementById('export').onclick=()=>{collect();if(!data.consent||!data.tester||!data.access||!data.network){status.textContent='请先填写代号、网络、入口结果并确认自愿参与。';return;}if(starts.size){status.textContent='请先停止正在进行的计时。';return;}if(data.tasks.some(t=>t.seconds!==null&&(!Number.isFinite(t.seconds)||t.seconds<0||t.seconds>86400))){status.textContent='秒数必须在0到86400之间，未知留空。';return;}const result={...data,kind:'participant-self-reported',exportedAt:new Date().toISOString(),note:'Self-reported task observation; not verified automatically and not evidence of game outcome improvement.'};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='zizai-trial-'+data.tester.replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status.textContent='已导出。请自己决定是否将文件交给项目作者；没有自动发送。';};
document.getElementById('reset').onclick=()=>{if(!confirm('清空此浏览器的当前试用记录？请先导出需要保留的内容。'))return;localStorage.removeItem(key);location.reload();};
</script></body></html>
